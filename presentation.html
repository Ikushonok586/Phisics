<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Режим презентации — Команда «Аналитики»</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="presentation">
    <main>
        <p class="red kicker">Режим презентации</p>
        <p id="presStepIndicator" class="yellow kicker">Шаг 1 из 4</p>
        <h1 id="presSlideTitle" class="yellow">Цель проекта</h1>
        <div id="presSlideText" class="red lead"></div>

        <div class="actions">
            <button type="button" id="presPrevBtn" class="btn">Назад</button>
            <button type="button" id="presNextBtn" class="btn">Далее</button>
            <a class="btn btn-red" href="index.html">Режим обзора</a>
        </div>
    </main>
    <script src="presentation.js"></script>
</body>
</html>
